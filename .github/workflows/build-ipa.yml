name: Build unsigned IPA

on:
  push:
    branches: [main]
    tags: ['v*']
    # Note: GitHub Actions ignores paths-ignore for tag pushes, so v* tags
    # always build and release even when the tagged commit only updated docs.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'THIRD_PARTY_LICENSES/**'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'THIRD_PARTY_LICENSES/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify repository (fast, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run repository checks
        run: python3 scripts/verify-repository.py

  build-ipa:
    name: Build unsigned IPA (macOS 26 / Xcode 26)
    needs: verify
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Print toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install xcodegen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Re-verify generated tree
        run: python3 scripts/verify-repository.py

      - name: Build and package unsigned IPA
        run: bash scripts/build-unsigned-ipa.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: CarCanvas-unsigned-ipa
          path: |
            artifacts/CarCanvas-v*-unsigned.ipa
            artifacts/build-report.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach IPA to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-ipa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: CarCanvas-unsigned-ipa
          path: artifacts
      - name: Extract three-language release notes
        run: python3 scripts/extract-release-notes.py "${GITHUB_REF_NAME}" -o artifacts/release-notes.md
      - name: Create release and upload IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          ipas=(artifacts/CarCanvas-v*-unsigned.ipa)
          [ "${#ipas[@]}" -eq 1 ] || { echo "ERROR: expected 1 IPA in artifacts/, found ${#ipas[@]}"; exit 1; }
          gh release create "${GITHUB_REF_NAME}" \
            "${ipas[0]}" \
            artifacts/build-report.txt \
            --title "CarCanvas ${GITHUB_REF_NAME}" \
            --notes-file artifacts/release-notes.md
